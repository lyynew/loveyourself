<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>送你一份专属治愈 ✨</title>
    <style>
        /* ============================================================
           DESIGN TOKENS
           ============================================================ */
        :root {
            --color-bg-start:   #f0e6ff;
            --color-bg-mid:     #fce4ec;
            --color-bg-end:     #e3f2fd;
            --color-primary:    #e8738a;
            --color-primary-light: #f8b4c8;
            --color-text-dark:  #3d2c3b;
            --color-text-soft:  #6b5c6e;
            --color-glass-bg:   rgba(255,255,255,0.65); /* 移动端略微加深不透明度，减少高斯模糊开销 */
            --color-glass-border: rgba(255,255,255,0.8);
            --radius-card:      18px;
            --radius-btn:       50px;
            --shadow-card:      0 8px 32px rgba(0,0,0,0.06);
            --shadow-btn:       0 8px 32px rgba(232,115,138,0.35);
            --font-family:      'PingFang SC','Microsoft YaHei','Noto Sans SC',system-ui,-apple-system,sans-serif;
            --transition-smooth: cubic-bezier(0.34, 1.56, 0.64, 1);
            --transition-bounce: cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        /* ============================================================
           RESET & BASE
           ============================================================ */
        *, *::before, *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 100vw;
            height: 100vh;
            height: 100dvh; /* 修复移动端浏览器底部地址栏遮挡问题 */
            overflow: hidden;
            font-family: var(--font-family);
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, var(--color-bg-start), var(--color-bg-mid), var(--color-bg-end));
            background-size: 400% 400%;
            animation: gradientShift 12s ease infinite;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        @keyframes gradientShift {
            0%   { background-position: 0% 50%; }
            50%  { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* ============================================================
           AMBIENT PARTICLES
           ============================================================ */
        #particles-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
        }

        /* ============================================================
           UI ELEMENTS
           ============================================================ */
        .subtitle {
            position: fixed;
            bottom: calc(env(safe-area-inset-bottom) + 48px);
            left: 50%;
            transform: translateX(-50%);
            color: var(--color-text-soft);
            font-size: 14px;
            letter-spacing: 2px;
            opacity: 0.5;
            transition: opacity 0.6s ease;
            z-index: 2;
            pointer-events: none;
            white-space: nowrap;
        }
        .subtitle.hidden { opacity: 0; }

        .gift-btn-wrap {
            position: relative;
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 18px;
        }

        .gift-btn {
            position: relative;
            display: inline-flex;
            align-items: center;
            gap: 12px;
            padding: 18px 44px;
            font-size: 20px;
            font-weight: 600;
            color: #fff;
            background: linear-gradient(135deg, #f093a0 0%, #e8738a 50%, #d46b8a 100%);
            background-size: 200% 200%;
            animation: btnGradient 4s ease infinite;
            border: none;
            border-radius: var(--radius-btn);
            cursor: pointer;
            box-shadow: var(--shadow-btn);
            transition: transform 0.3s var(--transition-smooth), opacity 0.45s ease, box-shadow 0.3s ease;
            letter-spacing: 1px;
            outline: none;
            overflow: hidden;
            transform: scale(1) translateY(0);
            opacity: 1;
        }

        @keyframes btnGradient {
            0%   { background-position: 0% 50%; }
            50%  { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .gift-btn::before {
            content: '';
            position: absolute;
            inset: -4px;
            border-radius: calc(var(--radius-btn) + 4px);
            background: linear-gradient(135deg, rgba(255,255,255,0.4), transparent, rgba(255,255,255,0.2));
            z-index: -1;
            opacity: 0;
            animation: pulseRing 2.5s ease-in-out infinite;
        }

        @keyframes pulseRing {
            0%, 100% { opacity: 0.3; transform: scale(1); }
            50%      { opacity: 0.7; transform: scale(1.04); }
        }

        /* 解决移动端点击后 hover 状态粘滞的问题 */
        @media (hover: hover) {
            .gift-btn:hover {
                transform: translateY(-3px) scale(1.02);
                box-shadow: 0 12px 40px rgba(232,115,138,0.5);
            }
            .healing-card.show:hover {
                opacity: 1;
                transform: scale(1.08) rotate(1deg);
                box-shadow: 0 12px 40px rgba(0,0,0,0.10), inset 0 1px 0 rgba(255,255,255,0.6);
                z-index: 10;
            }
        }
        
        .gift-btn:active {
            transform: translateY(-1px) scale(0.98);
        }

        .gift-btn .ripple {
            position: absolute;
            border-radius: 50%;
            background: rgba(255,255,255,0.35);
            transform: scale(0);
            animation: rippleAnim 0.6s ease-out forwards;
            pointer-events: none;
        }
        @keyframes rippleAnim {
            to { transform: scale(4); opacity: 0; }
        }

        .gift-btn.hidden {
            opacity: 0;
            transform: scale(0.6) translateY(20px);
            pointer-events: none;
        }
        .gift-btn.hidden + .subtitle {
            opacity: 0;
        }

        /* ============================================================
           HEALING CARDS (GPU 优化版)
           ============================================================ */
        #card-container {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            pointer-events: none; /* 容器不拦截点击 */
            z-index: 5;
            opacity: 1;
            transition: opacity 1.8s ease;
        }
        #card-container.fade-out {
            opacity: 0;
        }

        /* 外层负责硬件加速的位移 (translate3d) */
        .card-wrapper {
            position: absolute;
            top: 0; left: 0;
            will-change: transform; /* 提示浏览器开启 GPU 加速 */
            pointer-events: none;
        }

        /* 内层负责大小、旋转、颜色和悬浮动画 */
        .healing-card {
            width: 148px;
            min-height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 6px 12px;
            color: var(--color-text-dark);
            font-size: 14px;
            font-weight: 600;
            letter-spacing: 0.5px;
            border-radius: var(--radius-card);
            background: var(--color-glass-bg);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border: 1px solid var(--color-glass-border);
            box-shadow: var(--shadow-card), inset 0 1px 0 rgba(255,255,255,0.6);
            
            opacity: 0;
            transform: scale(0.4) rotate(-4deg);
            transition: opacity 0.45s var(--transition-smooth), 
                        transform 0.5s var(--transition-bounce),
                        box-shadow 0.25s ease;
            pointer-events: auto; /* 允许卡片响应交互 */
            white-space: nowrap;
        }

        .healing-card.show {
            opacity: 0.92;
            transform: scale(1) rotate(0deg);
        }

        /* ============================================================
           LOADING INDICATOR
           ============================================================ */
        .loading-dot {
            position: fixed;
            bottom: calc(env(safe-area-inset-bottom) + 20px);
            left: 50%;
            transform: translateX(-50%);
            z-index: 6;
            display: flex;
            gap: 8px;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.4s ease;
        }
        .loading-dot.active { opacity: 1; }
        .loading-dot span {
            width: 8px; height: 8px;
            border-radius: 50%;
            background: var(--color-primary-light);
            animation: dotBounce 1.2s ease-in-out infinite;
        }
        .loading-dot span:nth-child(2) { animation-delay: 0.15s; }
        .loading-dot span:nth-child(3) { animation-delay: 0.30s; }
        .loading-dot span:nth-child(4) { animation-delay: 0.45s; }
        .loading-dot span:nth-child(5) { animation-delay: 0.60s; }

        @keyframes dotBounce {
            0%, 80%, 100% { transform: scale(0.6); opacity: 0.3; }
            40%           { transform: scale(1.2); opacity: 1; }
        }

        /* ============================================================
           RESPONSIVE (精细化适配)
           ============================================================ */
        @media (max-width: 600px) {
            .gift-btn { padding: 14px 32px; font-size: 17px; }
            .healing-card {
                width: 110px; min-height: 34px; font-size: 12px;
                padding: 4px 10px; border-radius: 14px;
            }
            .subtitle { font-size: 12px; bottom: calc(env(safe-area-inset-bottom) + 36px); }
        }

        @media (max-width: 380px) {
            .healing-card {
                width: 95px; min-height: 30px; font-size: 11px;
                padding: 3px 6px; border-radius: 12px;
            }
        }
    </style>
</head>
<body>

    <canvas id="particles-canvas"></canvas>

    <div class="gift-btn-wrap">
        <button id="giftBtn" class="gift-btn">
            <span class="btn-icon">🎁</span>
            <span class="btn-text">送你一份专属治愈礼</span>
        </button>
        <div class="subtitle">轻触 · 感受温柔</div>
    </div>

    <div id="card-container"></div>

    <div id="loadingDot" class="loading-dot">
        <span></span><span></span><span></span><span></span><span></span>
    </div>

<script>
    // 1. 氛围粒子 (保持原样，Canvas 性能尚可)
    ;(function initParticles() {
        const canvas = document.getElementById('particles-canvas');
        const ctx = canvas.getContext('2d');
        let w, h, particles = [];

        function resize() {
            w = canvas.width = window.innerWidth;
            h = canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        // 移动端减少粒子数量降低性能消耗
        const COUNT = w < 600 ? 25 : 45; 
        for (let i = 0; i < COUNT; i++) {
            particles.push({
                x: Math.random() * w, y: Math.random() * h,
                r: Math.random() * 4 + 2,
                dx: (Math.random() - 0.5) * 0.35, dy: (Math.random() - 0.5) * 0.35,
                alpha: Math.random() * 0.35 + 0.1, hue: Math.random() * 60 + 280
            });
        }

        function draw() {
            ctx.clearRect(0, 0, w, h);
            particles.forEach(p => {
                p.x += p.dx; p.y += p.dy;
                if (p.x < 0) p.x = w; if (p.x > w) p.x = 0;
                if (p.y < 0) p.y = h; if (p.y > h) p.y = 0;

                ctx.beginPath();
                ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
                ctx.fillStyle = `hsla(${p.hue}, 60%, 75%, ${p.alpha})`;
                ctx.fill();

                ctx.beginPath();
                ctx.arc(p.x, p.y, p.r * 2.5, 0, Math.PI * 2);
                ctx.fillStyle = `hsla(${p.hue}, 60%, 80%, ${p.alpha * 0.2})`;
                ctx.fill();
            });
            requestAnimationFrame(draw);
        }
        draw();
    })();

    const WORDS = [
        "自信","温柔","接纳自己","你超棒","独一无二","闪闪发光","深呼吸","拥抱自己","你值得被爱","保持微笑",
        "慢慢来","听从内心","允许一切发生","你已经做得很好了","给自己一个拥抱","热爱生活","不完美也很美","活在当下",
        "治愈自己","勇敢","开心","自在","从容","坚强","温暖","美好","安心","轻松","快乐","知足","感恩",
        "善良","纯粹","坦荡","向阳而生","心向阳光","万事顺遂","平安喜乐","未来可期","不必焦虑","好好生活",
        "善待自己","爱自己","放松","不必完美","允许慢一点","你很好","不必比较","做自己","平静","愉悦",
        "舒心","自在如风","无忧","被偏爱","有底气","有力量","有温度","有光芒","轻装上阵","放下疲惫",
        "照顾好自己","享受当下","随心而行","温柔以待","与自己和解","不必逞强","不必慌张","保持热爱",
        "满心欢喜","眼里有光","心中有暖","步履不停","自在生长","万事胜意","平安顺遂","喜乐安康","无忧无虑"
    ];

    // 水波纹点击效果
    document.getElementById('giftBtn').addEventListener('click', function(e) {
        const rect = this.getBoundingClientRect();
        const size = Math.max(rect.width, rect.height);
        // 处理移动端触摸与鼠标点击的坐标差异
        const clientX = e.clientX || (e.touches && e.touches[0].clientX);
        const clientY = e.clientY || (e.touches && e.touches[0].clientY);
        
        if(!clientX || !clientY) return;

        const x = clientX - rect.left - size / 2;
        const y = clientY - rect.top - size / 2;
        const ripple = document.createElement('span');
        ripple.className = 'ripple';
        ripple.style.width = ripple.style.height = size + 'px';
        ripple.style.left = x + 'px';
        ripple.style.top = y + 'px';
        this.appendChild(ripple);
        setTimeout(() => ripple.remove(), 600);
    });

    // 4. HEALING APP (重构 GPU 动画逻辑)
    class HealingApp {
        constructor(onComplete) {
            this.container = document.getElementById('card-container');
            this.loadingEl = document.getElementById('loadingDot');
            this.onComplete = onComplete;

            this.sw = window.innerWidth;
            this.sh = window.innerHeight;
            
            // 根据屏幕宽度动态调整卡片数量和尺寸，防止移动端卡顿和越界
            this.isMobile = this.sw < 600;
            this.numWindows = this.isMobile ? 65 : 100; 
            
            this.cardW = this.sw <= 380 ? 95 : (this.sw <= 600 ? 110 : 148);
            this.cardH = this.sw <= 380 ? 30 : (this.sw <= 600 ? 34 : 40);

            this.cards = [];
            this.heartCoords = this.calcHeart();
            this.scatterCoords = this.calcScatter();

            this.loadingEl.classList.add('active');
            this.stepHeart(0);
        }

        randPastel() {
            const r = Math.floor(Math.random() * 40) + 216;
            const g = Math.floor(Math.random() * 40) + 216;
            const b = Math.floor(Math.random() * 40) + 216;
            return `rgba(${r},${g},${b}, 0.85)`; // 加入透明度优化渲染
        }

        randWord() {
            return WORDS[Math.floor(Math.random() * WORDS.length)];
        }

        calcHeart() {
            const coords = [];
            const cx = this.sw / 2;
            const cy = this.sh / 2 - (this.isMobile ? 20 : 40);
            // 确保爱心不超出屏幕边界
            const safeWidth = Math.min(this.sw - this.cardW, this.sh) * 0.9;
            const scale = safeWidth / 45; 

            for (let i = 0; i < this.numWindows; i++) {
                const t = i * (2 * Math.PI / this.numWindows);
                const x = 16 * Math.pow(Math.sin(t), 3);
                const y = 13 * Math.cos(t) - 5 * Math.cos(2*t) - 2 * Math.cos(3*t) - Math.cos(4*t);
                coords.push({
                    x: cx + x * scale - this.cardW / 2,
                    y: cy - y * scale - this.cardH / 2
                });
            }
            return coords;
        }

        calcScatter() {
            const coords = [];
            const aspect = this.sw / this.sh;
            const rows = Math.max(1, Math.floor(Math.sqrt(this.numWindows / aspect)));
            const cols = Math.ceil(this.numWindows / rows);
            const cellW = this.sw / cols;
            const cellH = this.sh / rows;

            const grid = [];
            for (let r = 0; r < rows; r++)
                for (let c = 0; c < cols; c++)
                    grid.push({c, r});

            for (let i = grid.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [grid[i], grid[j]] = [grid[j], grid[i]];
            }

            for (let i = 0; i < this.numWindows; i++) {
                const p = grid[i] || grid[0];
                const cx = p.c * cellW + cellW / 2;
                const cy = p.r * cellH + cellH / 2;
                const jx = (Math.random() * 0.8 - 0.4) * cellW;
                const jy = (Math.random() * 0.8 - 0.4) * cellH;
                
                // 严谨的边界检测，防止出现滚动条
                let x = cx + jx - this.cardW / 2;
                let y = cy + jy - this.cardH / 2;
                x = Math.max(10, Math.min(this.sw - this.cardW - 10, x));
                y = Math.max(10, Math.min(this.sh - this.cardH - 10, y));
                
                coords.push({x, y, rot: (Math.random() - 0.5) * 20}); 
            }
            return coords;
        }

        createCard(x, y) {
            // 使用内外层解耦：外层 wrapper 负责位移，内层 card 负责内容和入场动画
            const wrapper = document.createElement('div');
            wrapper.className = 'card-wrapper';
            wrapper.style.transform = `translate3d(${x}px, ${y}px, 0)`;

            const card = document.createElement('div');
            card.className = 'healing-card';
            card.style.background = `linear-gradient(135deg, ${this.randPastel()}, ${this.randPastel()})`;
            card.textContent = this.randWord();
            
            wrapper.appendChild(card);
            this.container.appendChild(wrapper);

            requestAnimationFrame(() => {
                requestAnimationFrame(() => card.classList.add('show'));
            });
            return { wrapper, card };
        }

        stepHeart(idx) {
            if (idx < this.numWindows) {
                const coord = this.heartCoords[idx];
                const elements = this.createCard(coord.x, coord.y);
                this.cards.push({
                    wrapper: elements.wrapper,
                    card: elements.card,
                    cx: coord.x, cy: coord.y,
                    tx: this.scatterCoords[idx].x,
                    ty: this.scatterCoords[idx].y,
                    trot: this.scatterCoords[idx].rot,
                    speed: Math.random() * (0.055 - 0.012) + 0.012,
                });
                
                // 移动端数量变少，降低延迟以保证心形拼合节奏
                const delay = this.isMobile ? (idx < 40 ? 35 : 50) : (idx < 60 ? 30 : 45);
                setTimeout(() => this.stepHeart(idx + 1), delay);
            } else {
                this.loadingEl.classList.remove('active');
                setTimeout(() => this.startScatter(), 2000);
            }
        }

        startScatter() {
            const animate = () => {
                let moving = false;

                this.cards.forEach(c => {
                    const dx = c.tx - c.cx;
                    const dy = c.ty - c.cy;

                    if (Math.abs(dx) > 1 || Math.abs(dy) > 1) {
                        moving = true;
                        c.cx += dx * c.speed;
                        c.cy += dy * c.speed;

                        // GPU 硬件加速位移
                        c.wrapper.style.transform = `translate3d(${c.cx}px, ${c.cy}px, 0)`;
                        
                        const rot = c.trot * (1 - Math.abs(dx) / (Math.abs(dx) + 50 || 1));
                        c.card.style.transform = `rotate(${rot}deg)`;
                    }
                });

                if (moving) {
                    requestAnimationFrame(animate);
                } else {
                    setTimeout(() => this.closeAll(), 5000);
                }
            };
            animate();
        }

        closeAll() {
            this.container.classList.add('fade-out');
            setTimeout(() => {
                this.container.innerHTML = '';
                this.container.classList.remove('fade-out');
                if (typeof this.onComplete === 'function') this.onComplete();
            }, 1800);
        }
    }

    // 5. MAIN
    window.addEventListener('load', () => {
        const btn = document.getElementById('giftBtn');
        let playing = false;

        btn.addEventListener('click', () => {
            if (playing) return;
            playing = true;

            btn.classList.add('hidden');

            new HealingApp(() => {
                btn.classList.remove('hidden');
                playing = false;
            });
        });
    });
</script>
</body>
</html>
