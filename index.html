<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>送你一份专属治愈 ✨</title>
    <style>
        /* ============================================================
           DESIGN TOKENS
           ============================================================ */
        :root {
            --color-bg-start:   #f0e6ff;
            --color-bg-mid:     #fce4ec;
            --color-bg-end:     #e3f2fd;
            --color-primary:    #e8738a;
            --color-primary-light: #f8b4c8;
            --color-text-dark:  #3d2c3b;
            --color-text-soft:  #6b5c6e;
            --color-glass-bg:   rgba(255,255,255,0.55);
            --color-glass-border: rgba(255,255,255,0.7);
            --radius-card:      18px;
            --radius-btn:       50px;
            --shadow-card:      0 8px 32px rgba(0,0,0,0.06);
            --shadow-btn:       0 8px 32px rgba(232,115,138,0.35);
            --font-family:      'PingFang SC','Microsoft YaHei','Noto Sans SC',system-ui,-apple-system,sans-serif;
            --transition-smooth: cubic-bezier(0.34, 1.56, 0.64, 1);
            --transition-bounce: cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        /* ============================================================
           RESET & BASE
           ============================================================ */
        *,
        *::before,
        *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            font-family: var(--font-family);
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, var(--color-bg-start), var(--color-bg-mid), var(--color-bg-end));
            background-size: 400% 400%;
            animation: gradientShift 12s ease infinite;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        @keyframes gradientShift {
            0%   { background-position: 0% 50%; }
            50%  { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* ============================================================
           AMBIENT PARTICLES (decorative background)
           ============================================================ */
        #particles-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
        }

        /* ============================================================
           SUBTITLE – below button
           ============================================================ */
        .subtitle {
            position: fixed;
            bottom: 48px;
            left: 50%;
            transform: translateX(-50%);
            color: var(--color-text-soft);
            font-size: 14px;
            letter-spacing: 2px;
            opacity: 0.5;
            transition: opacity 0.6s ease;
            z-index: 2;
            pointer-events: none;
        }
        .subtitle.hidden {
            opacity: 0;
        }

        /* ============================================================
           GIFT BUTTON
           ============================================================ */
        .gift-btn-wrap {
            position: relative;
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 18px;
        }

        .gift-btn {
            position: relative;
            display: inline-flex;
            align-items: center;
            gap: 12px;
            padding: 18px 44px;
            font-size: 20px;
            font-weight: 600;
            color: #fff;
            background: linear-gradient(135deg, #f093a0 0%, #e8738a 50%, #d46b8a 100%);
            background-size: 200% 200%;
            animation: btnGradient 4s ease infinite;
            border: none;
            border-radius: var(--radius-btn);
            cursor: pointer;
            box-shadow: var(--shadow-btn);
            transition: transform 0.3s var(--transition-smooth),
                        box-shadow 0.3s ease;
            letter-spacing: 1px;
            outline: none;
            -webkit-tap-highlight-color: transparent;
            overflow: hidden;
        }

        @keyframes btnGradient {
            0%   { background-position: 0% 50%; }
            50%  { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* 脉冲光晕环 */
        .gift-btn::before {
            content: '';
            position: absolute;
            inset: -4px;
            border-radius: calc(var(--radius-btn) + 4px);
            background: linear-gradient(135deg, rgba(255,255,255,0.4), transparent, rgba(255,255,255,0.2));
            z-index: -1;
            opacity: 0;
            transition: opacity 0.4s ease;
            animation: pulseRing 2.5s ease-in-out infinite;
        }

        @keyframes pulseRing {
            0%, 100% { opacity: 0.3; transform: scale(1); }
            50%      { opacity: 0.7; transform: scale(1.04); }
        }

        .gift-btn:hover {
            transform: translateY(-3px) scale(1.02);
            box-shadow: 0 12px 40px rgba(232,115,138,0.5);
        }
        .gift-btn:active {
            transform: translateY(-1px) scale(0.98);
        }

        /* ripple span */
        .gift-btn .ripple {
            position: absolute;
            border-radius: 50%;
            background: rgba(255,255,255,0.35);
            transform: scale(0);
            animation: rippleAnim 0.6s ease-out forwards;
            pointer-events: none;
        }
        @keyframes rippleAnim {
            to { transform: scale(4); opacity: 0; }
        }

        .gift-btn.hidden {
            opacity: 0;
            transform: scale(0.6) translateY(20px);
            pointer-events: none;
            transition: opacity 0.45s ease, transform 0.45s var(--transition-bounce);
        }
        .gift-btn.hidden + .subtitle {
            opacity: 0;
        }

        /* visible transition (reappear) */
        .gift-btn {
            opacity: 1;
            transform: scale(1) translateY(0);
            transition: opacity 0.45s ease,
                        transform 0.45s var(--transition-bounce),
                        box-shadow 0.3s ease;
        }

        /* ============================================================
           CARD CONTAINER
           ============================================================ */
        #card-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 5;
            opacity: 1;
            transition: opacity 1.8s ease;
        }
        #card-container.fade-out {
            opacity: 0;
        }

        /* ============================================================
           HEALING CARDS  (玻璃质感 · 精致圆角 · 优雅排版)
           ============================================================ */
        .healing-card {
            position: absolute;
            /* slightly larger for better readability */
            width: 148px;
            min-height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 6px 12px;
            color: var(--color-text-dark);
            font-size: 14px;
            font-weight: 600;
            letter-spacing: 0.5px;
            border-radius: var(--radius-card);
            background: var(--color-glass-bg);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border: 1px solid var(--color-glass-border);
            box-shadow: var(--shadow-card);
            opacity: 0;
            transform: scale(0.4) rotate(-4deg);
            transition: opacity 0.45s var(--transition-smooth),
                        transform 0.5s var(--transition-bounce);
            user-select: none;
            will-change: transform, opacity, left, top;
            /* subtle inner glow */
            box-shadow: var(--shadow-card),
                        inset 0 1px 0 rgba(255,255,255,0.6);
        }

        .healing-card.show {
            opacity: 0.92;
            transform: scale(1) rotate(0deg);
        }

        /* Subtle hover lift (only when user manages to hover) */
        .healing-card.show:hover {
            opacity: 1;
            transform: scale(1.08) rotate(1deg);
            box-shadow: 0 12px 40px rgba(0,0,0,0.10),
                        inset 0 1px 0 rgba(255,255,255,0.6);
            transition: transform 0.25s var(--transition-smooth),
                        opacity 0.25s ease,
                        box-shadow 0.25s ease;
        }

        /* ============================================================
           LOADING INDICATOR (during heart building)
           ============================================================ */
        .loading-dot {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 6;
            display: flex;
            gap: 8px;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.4s ease;
        }
        .loading-dot.active {
            opacity: 1;
        }
        .loading-dot span {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--color-primary-light);
            animation: dotBounce 1.2s ease-in-out infinite;
        }
        .loading-dot span:nth-child(2) { animation-delay: 0.15s; }
        .loading-dot span:nth-child(3) { animation-delay: 0.30s; }
        .loading-dot span:nth-child(4) { animation-delay: 0.45s; }
        .loading-dot span:nth-child(5) { animation-delay: 0.60s; }

        @keyframes dotBounce {
            0%, 80%, 100% { transform: scale(0.6); opacity: 0.3; }
            40%           { transform: scale(1.2); opacity: 1; }
        }

        /* ============================================================
           RESPONSIVE
           ============================================================ */
        @media (max-width: 600px) {
            .gift-btn {
                padding: 14px 32px;
                font-size: 17px;
            }
            .healing-card {
                width: 110px;
                min-height: 34px;
                font-size: 12px;
                padding: 4px 10px;
                border-radius: 14px;
            }
            .subtitle {
                font-size: 12px;
                bottom: 36px;
            }
        }

        @media (max-width: 380px) {
            .healing-card {
                width: 90px;
                min-height: 30px;
                font-size: 11px;
                padding: 3px 8px;
                border-radius: 12px;
            }
        }
    </style>
</head>
<body>

    <!-- ====== Ambient Particles (Canvas) ====== -->
    <canvas id="particles-canvas"></canvas>

    <!-- ====== Button Area ====== -->
    <div class="gift-btn-wrap">
        <button id="giftBtn" class="gift-btn">
            <span class="btn-icon">🎁</span>
            <span class="btn-text">送你一份专属治愈礼</span>
        </button>
        <div class="subtitle">轻触 · 感受温柔</div>
    </div>

    <!-- ====== Card Container ====== -->
    <div id="card-container"></div>

    <!-- ====== Loading Indicator ====== -->
    <div id="loadingDot" class="loading-dot">
        <span></span><span></span><span></span><span></span><span></span>
    </div>

<script>
    // ================================================================
    // 1. AMBIENT PARTICLES (floating orbs)
    // ================================================================
    ;(function initParticles() {
        const canvas = document.getElementById('particles-canvas');
        const ctx = canvas.getContext('2d');
        let w, h, particles = [];

        function resize() {
            w = canvas.width = window.innerWidth;
            h = canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        const COUNT = 45;
        for (let i = 0; i < COUNT; i++) {
            particles.push({
                x: Math.random() * w,
                y: Math.random() * h,
                r: Math.random() * 4 + 2,
                dx: (Math.random() - 0.5) * 0.35,
                dy: (Math.random() - 0.5) * 0.35,
                alpha: Math.random() * 0.35 + 0.1,
                hue: Math.random() * 60 + 280, // purple-pink range
            });
        }

        function draw() {
            ctx.clearRect(0, 0, w, h);
            particles.forEach(p => {
                p.x += p.dx;
                p.y += p.dy;
                if (p.x < 0) p.x = w;
                if (p.x > w) p.x = 0;
                if (p.y < 0) p.y = h;
                if (p.y > h) p.y = 0;

                ctx.beginPath();
                ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
                ctx.fillStyle = `hsla(${p.hue}, 60%, 75%, ${p.alpha})`;
                ctx.fill();

                // soft glow
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.r * 2.5, 0, Math.PI * 2);
                ctx.fillStyle = `hsla(${p.hue}, 60%, 80%, ${p.alpha * 0.2})`;
                ctx.fill();
            });
            requestAnimationFrame(draw);
        }
        draw();
    })();

    // ================================================================
    // 2. WORDS
    // ================================================================
    const WORDS = [
        "自信","温柔","接纳自己","你超棒","独一无二",
        "闪闪发光","深呼吸","拥抱自己","你值得被爱","保持微笑",
        "慢慢来","听从内心","允许一切发生","你已经做得很好了",
        "给自己一个拥抱","热爱生活","不完美也很美","活在当下","治愈自己",
        "勇敢","开心","自在","从容","坚强",
        "温暖","美好","安心","轻松","快乐",
        "知足","感恩","善良","纯粹","坦荡",
        "向阳而生","心向阳光","万事顺遂","平安喜乐","未来可期",
        "不必焦虑","好好生活","善待自己","爱自己","放松",
        "不必完美","允许慢一点","你很好","不必比较","做自己",
        "平静","愉悦","舒心","自在如风","无忧",
        "被偏爱","有底气","有力量","有温度","有光芒",
        "轻装上阵","放下疲惫","照顾好自己","享受当下","随心而行",
        "温柔以待","与自己和解","不必逞强","不必慌张","保持热爱",
        "满心欢喜","眼里有光","心中有暖","步履不停","自在生长",
        "万事胜意","平安顺遂","喜乐安康","无忧无虑","自在欢喜",
        "温柔坚定","清醒独立","从容自在","平静喜乐","温暖有光",
        "好好爱自己","生活很可爱","世界很温柔","你很珍贵","值得一切美好",
        "放松心情","停止内耗","放过自己","安心就好","一切都好",
        "慢慢变好","静静成长","稳稳幸福","岁岁欢喜","年年无忧"
    ];

    const CARD_W = 148;
    const CARD_H = 40;

    // ================================================================
    // 3. RIPPLE EFFECT on button
    // ================================================================
    document.getElementById('giftBtn').addEventListener('click', function(e) {
        const rect = this.getBoundingClientRect();
        const size = Math.max(rect.width, rect.height);
        const x = e.clientX - rect.left - size / 2;
        const y = e.clientY - rect.top - size / 2;
        const ripple = document.createElement('span');
        ripple.className = 'ripple';
        ripple.style.width = ripple.style.height = size + 'px';
        ripple.style.left = x + 'px';
        ripple.style.top = y + 'px';
        this.appendChild(ripple);
        setTimeout(() => ripple.remove(), 600);
    });

    // ================================================================
    // 4. HEALING APP (optimized)
    // ================================================================
    class HealingApp {
        constructor(onComplete) {
            this.container = document.getElementById('card-container');
            this.loadingEl = document.getElementById('loadingDot');
            this.onComplete = onComplete;

            this.sw = window.innerWidth;
            this.sh = window.innerHeight;
            this.numWindows = 100;
            this.cards = [];

            this.heartCoords = this.calcHeart();
            this.scatterCoords = this.calcScatter();

            // show loading
            this.loadingEl.classList.add('active');

            this.stepHeart(0);
        }

        randPastel() {
            const r = Math.floor(Math.random() * 40) + 216;
            const g = Math.floor(Math.random() * 40) + 216;
            const b = Math.floor(Math.random() * 40) + 216;
            return `rgb(${r},${g},${b})`;
        }

        randWord() {
            return WORDS[Math.floor(Math.random() * WORDS.length)];
        }

        calcHeart() {
            const coords = [];
            const cx = this.sw / 2;
            const cy = this.sh / 2 - 40;
            const scale = Math.min(this.sw, this.sh) / 50;
            for (let i = 0; i < this.numWindows; i++) {
                const t = i * (2 * Math.PI / this.numWindows);
                const x = 16 * Math.pow(Math.sin(t), 3);
                const y = 13 * Math.cos(t) - 5 * Math.cos(2*t) - 2 * Math.cos(3*t) - Math.cos(4*t);
                coords.push({
                    x: cx + x * scale - CARD_W / 2,
                    y: cy - y * scale - CARD_H / 2
                });
            }
            return coords;
        }

        calcScatter() {
            const coords = [];
            const aspect = this.sw / this.sh;
            const rows = Math.max(1, Math.floor(Math.sqrt(this.numWindows / aspect)));
            const cols = Math.ceil(this.numWindows / rows);
            const cellW = this.sw / cols;
            const cellH = this.sh / rows;

            const grid = [];
            for (let r = 0; r < rows; r++)
                for (let c = 0; c < cols; c++)
                    grid.push({c, r});

            // shuffle
            for (let i = grid.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [grid[i], grid[j]] = [grid[j], grid[i]];
            }

            for (let i = 0; i < this.numWindows; i++) {
                const p = grid[i] || grid[0];
                const cx = p.c * cellW + cellW / 2;
                const cy = p.r * cellH + cellH / 2;
                const jx = (Math.random() * 0.8 - 0.4) * cellW;
                const jy = (Math.random() * 0.8 - 0.4) * cellH;
                let x = cx + jx - CARD_W / 2;
                let y = cy + jy - CARD_H / 2;
                x = Math.max(0, Math.min(this.sw - CARD_W, x));
                y = Math.max(0, Math.min(this.sh - CARD_H, y));
                coords.push({x, y, rot: (Math.random() - 0.5) * 20}); // random rotation target
            }
            return coords;
        }

        createCard(x, y) {
            const el = document.createElement('div');
            el.className = 'healing-card';
            el.style.left = x + 'px';
            el.style.top = y + 'px';
            el.style.background = `linear-gradient(135deg, ${this.randPastel()}, ${this.randPastel()})`;
            el.textContent = this.randWord();
            this.container.appendChild(el);

            // double rAF for smooth entry
            requestAnimationFrame(() => {
                requestAnimationFrame(() => el.classList.add('show'));
            });
            return el;
        }

        stepHeart(idx) {
            if (idx < this.numWindows) {
                const coord = this.heartCoords[idx];
                const el = this.createCard(coord.x, coord.y);
                this.cards.push({
                    el,
                    cx: coord.x,
                    cy: coord.y,
                    tx: this.scatterCoords[idx].x,
                    ty: this.scatterCoords[idx].y,
                    trot: this.scatterCoords[idx].rot,
                    speed: Math.random() * (0.055 - 0.012) + 0.012,
                });
                const delay = idx < 60 ? 30 : 45;
                setTimeout(() => this.stepHeart(idx + 1), delay);
            } else {
                // heart fully built
                this.loadingEl.classList.remove('active');
                setTimeout(() => this.startScatter(), 2800);
            }
        }

        startScatter() {
            const animate = () => {
                let moving = false;

                this.cards.forEach(c => {
                    const dx = c.tx - c.cx;
                    const dy = c.ty - c.cy;

                    if (Math.abs(dx) > 1 || Math.abs(dy) > 1) {
                        moving = true;
                        c.cx += dx * c.speed;
                        c.cy += dy * c.speed;

                        // slight rotation during scatter
                        const progress = Math.abs(dx) > 1 || Math.abs(dy) > 1 ? 1 : 0;
                        const rot = c.trot * (1 - Math.abs(dx) / (Math.abs(dx) + 50 || 1));

                        c.el.style.left = c.cx + 'px';
                        c.el.style.top = c.cy + 'px';
                        c.el.style.transform = `rotate(${rot}deg)`;
                    }
                });

                if (moving) {
                    requestAnimationFrame(animate);
                } else {
                    // All cards settled – hold then fade out
                    setTimeout(() => this.closeAll(), 5000);
                }
            };
            animate();
        }

        closeAll() {
            // fade out container
            this.container.classList.add('fade-out');
            setTimeout(() => {
                this.container.innerHTML = '';
                this.container.classList.remove('fade-out');
                if (typeof this.onComplete === 'function') this.onComplete();
            }, 2000);
        }
    }

    // ================================================================
    // 5. MAIN
    // ================================================================
    window.addEventListener('load', () => {
        const btn = document.getElementById('giftBtn');
        let playing = false;

        btn.addEventListener('click', () => {
            if (playing) return;
            playing = true;

            btn.classList.add('hidden');

            new HealingApp(() => {
                btn.classList.remove('hidden');
                playing = false;
            });
        });
    });
</script>
</body>
</html>
